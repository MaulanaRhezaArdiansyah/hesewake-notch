name: Claude Code test exe

# Throwaway: a release exe of feat/claude-code to try on a PC.
on:
  push:
    branches: ["ci-check/claude-exe"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Build release
        run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-exe
          path: target/release/hesewake-notch.exe
          retention-days: 7
