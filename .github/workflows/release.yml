name: Release

# Push tag versi (mis. v0.3.3) -> build exe + installer, lalu buat GitHub Release berstatus draft.
# Draft perlu dicek dan dipublikasikan manual.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tag harus sama dengan versi di Cargo.toml
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} tidak sama dengan versi Cargo.toml ($ver)" }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Pasang Inno Setup bila belum ada
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $found) { choco install innosetup -y --no-progress }

      - name: Build exe + installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Catatan rilis dari CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($env:VERSION))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { "Lihat CHANGELOG.md." | Set-Content notes.md; exit 0 }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Set-Content notes.md

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "installer_output\HesewakeNotch-Setup-$env:VERSION.exe"
          gh release create "${{ github.ref_name }}" $setup --draft --title "Hesewake Notch $env:VERSION" --notes-file notes.md
