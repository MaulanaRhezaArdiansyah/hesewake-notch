name: Agents extension

on:
  push:
    paths:
      - "extensions/agents/**"
      - ".github/workflows/agents-extension.yml"
  pull_request:
    paths:
      - "extensions/agents/**"
      - ".github/workflows/agents-extension.yml"
  workflow_dispatch:

concurrency:
  group: agents-ext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extensions/agents
    env:
      RUSTFLAGS: -C target-feature=+crt-static -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: extensions/agents
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Installer
        if: hashFiles('extensions/agents/installer.iss') != ''
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem installer_output | ForEach-Object { "$($_.Name)  $((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())" }
      - name: Upload the extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hesewake-agents
          path: |
            extensions/agents/target/release/hesewake-agents.exe
            extensions/agents/installer_output/*.exe
            extensions/agents/Cargo.lock
          retention-days: 30
