name: UX audit run

# Throwaway branch only: drives the released 0.13.5 on a fresh Windows runner for the UX audit.
on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ext/agents
          path: agents-src
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ext/odoo
          path: odoo-src
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Build the two extensions
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --manifest-path agents-src/extensions/agents/Cargo.toml
          cargo build --release --locked --manifest-path odoo-src/extensions/odoo/Cargo.toml
      - name: Install the released notch 0.13.5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.13.5 -R dirgaastya/hesewake-notch -p "HesewakeNotch-Setup-0.13.5.exe" -p SHA256SUMS -D rel
          $want = (Get-Content rel/SHA256SUMS | Select-String 'HesewakeNotch-Setup-0.13.5.exe').Line.Split(' ')[0]
          $got = (Get-FileHash rel/HesewakeNotch-Setup-0.13.5.exe).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch" }
          Start-Process rel/HesewakeNotch-Setup-0.13.5.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait
          Test-Path "$env:LOCALAPPDATA\Programs\Hesewake Notch\hesewake-notch.exe"
      - name: Try a 1920x1080 desktop
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Drive the notch
        shell: powershell
        env:
          OUT: ${{ github.workspace }}\out
        run: |
          $a = (Resolve-Path agents-src/extensions/agents/target/release/hesewake-agents.exe).Path
          $o = (Resolve-Path odoo-src/extensions/odoo/target/release/hesewake-odoo.exe).Path
          powershell -NoProfile -ExecutionPolicy Bypass -File ux-run.ps1 -AgentsExe $a -OdooExe $o
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ux-run
          path: out
          retention-days: 1
