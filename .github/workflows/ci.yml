name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      # RUSTFLAGS replaces rustflags from .cargo/config.toml, so +crt-static is repeated here.
      RUSTFLAGS: -C target-feature=+crt-static -D warnings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build (warning = error)
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy (report only)
        # Many existing findings remain (e.g. too_many_arguments), so it does not fail the build yet.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo clippy --locked
