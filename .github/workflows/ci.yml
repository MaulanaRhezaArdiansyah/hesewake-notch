name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      # RUSTFLAGS replaces rustflags from .cargo/config.toml, so +crt-static is repeated here.
      RUSTFLAGS: -C target-feature=+crt-static -D warnings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build (warning = error)
        run: cargo build --locked
      - name: Test
        # SNAPSHOT_DIR: the tests in src/snapshot.rs save notch renders here (see the artifact below).
        env:
          SNAPSHOT_DIR: ${{ github.workspace }}/ui-snapshots
        run: cargo test --locked
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots
          path: ui-snapshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Clippy (report only)
        # Many existing findings remain (e.g. too_many_arguments), so it does not fail the build yet.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo clippy --locked
