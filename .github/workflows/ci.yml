name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      # RUSTFLAGS menggantikan rustflags di .cargo/config.toml, jadi +crt-static diulang di sini.
      RUSTFLAGS: -C target-feature=+crt-static -D warnings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build (warning = error)
        run: cargo build --locked
      - name: Test
        # SNAPSHOT_DIR: tes di src/snapshot.rs menyimpan gambar tampilan notch ke sini (lihat artifact di bawah).
        env:
          SNAPSHOT_DIR: ${{ github.workspace }}/ui-snapshots
        run: cargo test --locked
      - name: Upload snapshot tampilan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots
          path: ui-snapshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Clippy (laporan saja)
        # Masih banyak temuan lama (mis. too_many_arguments); belum dijadikan syarat lolos.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo clippy --locked
