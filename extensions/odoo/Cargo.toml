[package]
name = "hesewake-odoo"
version = "0.1.0"
edition = "2021"
description = "Odoo tickets for Hesewake Notch, as an extension (docs/extensions.md)"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinInet",
  "Win32_Security_Credentials",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
# a panic in the network thread must not leave the pipe loop waiting forever: end the process, the notch restarts it
panic = "abort"

# Not part of the notch's build: build it on its own with `cargo build --release` in this folder.
[workspace]
